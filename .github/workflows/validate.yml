name: Validate blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install PyYAML pytest
      - name: Validate Home Assistant blueprint
        run: python -m pytest -q

  runtime:
    name: Run blueprint in Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: python -m pip install -r requirements_test.txt
      - name: Run blueprint tests in a Home Assistant test instance
        run: python -m pytest -q
