blueprint:
  name: Update check with Grok (web + X search)
  description: >-
    Before you hit "Install", let Grok (xAI) check whether people are reporting
    problems with that exact version on X, GitHub, Reddit and the Home Assistant
    forum. A few hours after an update appears, you get a push notification with
    a verdict (Install / Wait / Caution) and up to three concrete issues. The full
    answer with sources is also saved as a Home Assistant notification.


    Run the automation manually (Run actions, or a dashboard button calling
    `automation.trigger`) to check every pending update from your list right away.


    Requires the "xAI Grok Conversation" integration from HACS
    (braytonstafford/grok_conversation) and the Home Assistant Companion app.


    Version 1.1.0 – changelog: https://github.com/uekala/ha-grok-update-check/blob/main/CHANGELOG.md
  domain: automation
  author: uekala
  source_url: https://github.com/uekala/ha-grok-update-check/blob/main/blueprints/automation/grok_update_check.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    watch:
      name: What to check
      icon: mdi:package-up
      input:
        update_entities:
          name: Updates to watch
          description: >-
            Update entities to check. Good candidates: Home Assistant Core and
            Operating System, important add-ons (e.g. Matter Server) and your
            HACS integrations. Device firmware and dashboard cards are usually
            not worth the API cost.
          selector:
            entity:
              domain: update
              multiple: true
        delay_hours:
          name: Wait before checking
          description: >-
            Hours an update must be available before Grok checks it, so that first
            reports have time to show up. Installing the update before then skips
            the check. The wait survives Home Assistant restarts: after a restart
            it starts again for updates that are still pending.
          default: 4
          selector:
            number:
              min: 0
              max: 48
              step: 1
              unit_of_measurement: h
              mode: slider
        memory:
          name: Remember checked versions (optional)
          description: >-
            A text helper (input_text, set its maximum length to 255) where the
            automation notes which versions it has already checked. With it, a
            restart never causes a second check of the same version, and a newer
            version that replaces a pending one is checked too. Without it, an
            update that is still pending after a restart is checked once more
            after the wait.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text
    grok:
      name: Grok
      icon: mdi:robot-outline
      input:
        grok_entry:
          name: Grok integration
          description: Your "xAI Grok Conversation" integration entry.
          selector:
            config_entry:
              integration: grok_conversation
        live_search:
          name: Live search
          description: Where Grok searches. "Full" covers the web and X.
          default: full
          selector:
            select:
              options:
                - label: Full (web + X)
                  value: full
                - label: Web only
                  value: web
                - label: X only
                  value: x
        setup_description:
          name: Your setup (optional)
          description: >-
            A short description of your setup, so Grok focuses on problems that
            matter to you. Example: "Home Assistant Green with HAOS, Zigbee via ZHA,
            Matter over Thread, many HACS integrations". This text is sent to xAI.
          default: ""
          selector:
            text:
              multiline: true
        language:
          name: Answer language
          default: English
          selector:
            text:
    notify:
      name: Notifications
      icon: mdi:cellphone-message
      input:
        notify_device:
          name: Phone
          description: Device with the Home Assistant Companion app.
          selector:
            device:
              filter:
                - integration: mobile_app
        persistent:
          name: Also save as Home Assistant notification
          description: Keeps the full answer including sources in the notification panel.
          default: true
          selector:
            boolean:
    texts:
      name: Texts
      icon: mdi:translate
      collapsed: true
      input:
        no_updates_text:
          name: Nothing pending
          description: Sent when you run the check manually and no watched update is pending.
          default: No pending updates among the watched entities.
          selector:
            text:
        failure_text:
          name: Check failed
          description: Sent instead of Grok's answer when the request fails.
          default: Grok check failed. Please read the release notes yourself.
          selector:
            text:

mode: queued
max: 10

# Instead of a state trigger with "for:" (which Home Assistant resets on every
# restart), the automation looks every 15 minutes for updates whose wait is
# over. Each update is due in exactly one of these 15-minute windows.
triggers:
  - trigger: time_pattern
    id: periodic
    minutes: "/15"

variables:
  update_entities: !input update_entities
  delay_hours: !input delay_hours
  memory_entity: !input memory
  live_search: !input live_search
  setup_description: !input setup_description
  language: !input language
  persistent: !input persistent
  no_updates_text: !input no_updates_text
  failure_text: !input failure_text
  periodic: "{{ trigger is defined and trigger.id is defined and trigger.id == 'periodic' }}"
  # Checked versions from the optional text helper: {"<index in the list>": "<version>"}
  remembered: >-
    {%- set ns = namespace(pairs=[]) -%}
    {%- if memory_entity -%}
      {%- for part in (states(memory_entity) | string).split(';') if '=' in part -%}
        {%- set ns.pairs = ns.pairs + [part.split('=', 1)] -%}
      {%- endfor -%}
    {%- endif -%}
    {{ dict(ns.pairs) }}
  targets: >-
    {%- set ns = namespace(out=[]) -%}
    {%- if periodic -%}
      {%- set window_end = trigger.now.replace(minute=(trigger.now.minute // 15) * 15, second=0, microsecond=0) -%}
      {%- set window_start = window_end - timedelta(minutes=15) -%}
    {%- endif -%}
    {%- for entity in update_entities if is_state(entity, 'on') -%}
      {%- if not periodic -%}
        {%- set ns.out = ns.out + [entity] -%}
      {%- else -%}
        {%- set due = states[entity].last_changed + timedelta(hours=delay_hours | float(0)) -%}
        {%- set version = state_attr(entity, 'latest_version') | string -%}
        {%- set key = update_entities.index(entity) | string -%}
        {#- Due once the wait is over: in its 15-minute window, or later if the
            remembered version differs (a newer version replaced a checked one). -#}
        {%- if due <= window_end -%}
          {%- if key in remembered -%}
            {%- if remembered[key] != version -%}
              {%- set ns.out = ns.out + [entity] -%}
            {%- endif -%}
          {%- elif due > window_start -%}
            {%- set ns.out = ns.out + [entity] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.out }}

conditions:
  - alias: Something is due (manual runs skip this condition)
    condition: template
    value_template: "{{ targets | count > 0 }}"

actions:
  - alias: Manual run with nothing pending
    if:
      - "{{ targets | count == 0 }}"
    then:
      - device_id: !input notify_device
        domain: mobile_app
        type: notify
        title: Update check
        message: "{{ no_updates_text }}"
      - stop: No pending updates

  - alias: Check each update
    repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            grok: "{{ {} }}"
            component: >-
              {{ state_attr(repeat.item, 'title')
                 | default(state_attr(repeat.item, 'friendly_name') | replace(' Update', ''), true) }}
            installed: "{{ state_attr(repeat.item, 'installed_version') }}"
            latest: "{{ state_attr(repeat.item, 'latest_version') }}"
            release_url: "{{ state_attr(repeat.item, 'release_url') | default('none', true) }}"

        - alias: Ask Grok for reported problems
          action: grok_conversation.ask
          continue_on_error: true
          data:
            config_entry: !input grok_entry
            live_search: "{{ live_search }}"
            show_citations: true
            instructions: >-
              You check whether a Home Assistant update is safe to install.
              Search X, GitHub issues and release notes, the Home Assistant
              community forum and Reddit for problems reported with exactly this
              version.
              {% if setup_description %}The user's setup: {{ setup_description }}.
              Focus on problems relevant to this setup.{% endif %}
              Answer in {{ language }}, without an introduction, in at most 600
              characters. Line 1 is exactly one of "Recommendation: Install",
              "Recommendation: Wait" or "Recommendation: Caution", translated into
              {{ language }}. Then at most 3 short bullet points with concrete
              reported problems or breaking changes. If nothing relevant is
              reported, say so in one sentence. Never invent problems.
            input_data: |-
              Component: {{ component }}
              Installed version: {{ installed }}
              New version: {{ latest }}
              Release notes: {{ release_url }}
          response_variable: grok

        - variables:
            answer: >-
              {{ grok.response_text
                 if grok is defined and grok.response_text is defined
                 else failure_text }}

        - alias: Short version to the phone
          device_id: !input notify_device
          domain: mobile_app
          type: notify
          title: "Update: {{ component }} {{ latest }}"
          message: "{{ (answer.split('Sources:')[0] | trim)[:900] }}"
          data:
            tag: "grok-update-check-{{ repeat.item }}"
            url: /config/updates
            clickAction: /config/updates

        - alias: Full answer with sources
          if:
            - "{{ persistent }}"
          then:
            - action: persistent_notification.create
              data:
                notification_id: "grok_update_check_{{ repeat.item | replace('.', '_') }}"
                title: "Update check: {{ component }} {{ installed }} → {{ latest }}"
                message: "{{ answer }}"

  - alias: Remember checked versions
    if:
      - "{{ memory_entity != '' }}"
    then:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ memory_entity }}"
        data:
          value: >-
            {%- set ns = namespace(parts=[], text='') -%}
            {%- for entity in update_entities -%}
              {%- set key = loop.index0 | string -%}
              {%- if entity in targets -%}
                {%- set ns.parts = ns.parts + [key ~ '=' ~ state_attr(entity, 'latest_version')] -%}
              {%- elif is_state(entity, 'on') and remembered.get(key) -%}
                {%- set ns.parts = ns.parts + [key ~ '=' ~ remembered.get(key)] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set limit = state_attr(memory_entity, 'max') | int(100) -%}
            {%- for part in ns.parts -%}
              {%- set candidate = (ns.text ~ ';' ~ part) if ns.text else part -%}
              {%- if candidate | length <= limit -%}
                {%- set ns.text = candidate -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.text }}
